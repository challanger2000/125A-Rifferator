name: Rifferator V1 manual verification
on:
  workflow_dispatch:
jobs:
  build-and-core-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_STANDARD=23
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Core regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Save built binaries
        uses: actions/upload-artifact@v4
        with:
          name: rifferator-dev-windows-x64
          path: build/VST3/Release/*.vst3
          if-no-files-found: warn
