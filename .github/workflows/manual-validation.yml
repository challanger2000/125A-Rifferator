name: Rifferator V1 controlled verification
on:
  workflow_dispatch:
  push:
    branches:
      - develop/v1.0.0
    paths:
      - ci/TRIGGER_BUILD
jobs:
  build-and-core-tests:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_STANDARD=23
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Core regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Steinberg Validator
        shell: pwsh
        run: |
          $validator = Get-ChildItem build -Recurse -Filter validator.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $validator) { throw 'Steinberg validator.exe not found' }
          $plugin = Join-Path (Resolve-Path 'build/VST3/Release') '125A Rifferator.vst3'
          if (-not (Test-Path $plugin)) { throw 'Rifferator VST3 bundle missing' }
          & $validator.FullName -e $plugin
          if ($LASTEXITCODE -ne 0) { throw "Steinberg validator failed: $LASTEXITCODE" }
      - name: Save built binaries
        uses: actions/upload-artifact@v4
        with:
          name: rifferator-dev-windows-x64
          path: build/VST3/Release/*.vst3
          if-no-files-found: warn
