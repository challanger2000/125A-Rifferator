name: Rifferator V1 controlled verification
on:
  workflow_dispatch:
  push:
    branches:
      - develop/v1.0.0
    paths:
      - ci/TRIGGER_BUILD
jobs:
  build-and-core-tests:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_STANDARD=23
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Brand complete VST3 delivery bundle
        shell: pwsh
        run: |
          $dir = (Resolve-Path 'build/VST3/Release').Path
          $source = Join-Path $dir 'Rifferator.vst3'
          $target = Join-Path $dir '125A Rifferator.vst3'
          if (-not (Test-Path $source -PathType Container)) { throw "SDK package missing: $source" }
          if (Test-Path $target) { throw "Duplicate target bundle exists: $target" }
          Move-Item -LiteralPath $source -Destination $target
          $binaryDir = Join-Path $target 'Contents/x86_64-win'
          $oldBinary = Join-Path $binaryDir 'Rifferator.vst3'
          $newBinary = Join-Path $binaryDir '125A Rifferator.vst3'
          if (-not (Test-Path $oldBinary -PathType Leaf)) { throw "SDK binary missing: $oldBinary" }
          Move-Item -LiteralPath $oldBinary -Destination $newBinary
      - name: Core regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: VST3 delivery and GUI resource audit
        shell: pwsh
        run: |
          $root = Join-Path (Resolve-Path 'build/VST3/Release') '125A Rifferator.vst3'
          if (-not (Test-Path $root -PathType Container)) { throw "Incorrect VST3 bundle name or missing bundle: $root" }
          $uidesc = Join-Path $root 'Contents/Resources/rifferator.uidesc'
          if (-not (Test-Path $uidesc -PathType Leaf)) { throw "Missing installed GUI resource: $uidesc" }
          $xml = Get-Content -Raw -LiteralPath $uidesc
          if ($xml -notmatch '<template name="RifferatorView"') { throw 'GUI template RifferatorView not found in deployed bundle' }
          $binaries = @(Get-ChildItem -Path (Join-Path $root 'Contents') -Recurse -File -Filter '*.vst3')
          if ($binaries.Count -ne 1) { throw "Expected one VST3 module binary, found $($binaries.Count)" }
          if ($binaries[0].Name -ne '125A Rifferator.vst3') { throw "Branded binary mismatch: $($binaries[0].Name)" }
          if (Test-Path (Join-Path (Resolve-Path 'build/VST3/Release') 'Rifferator.vst3')) { throw 'Unbranded VST3 bundle present' }
      - name: Steinberg Validator
        shell: pwsh
        run: |
          $validator = Get-ChildItem build -Recurse -Filter validator.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $validator) { throw 'Steinberg validator.exe not found' }
          $plugin = Join-Path (Resolve-Path 'build/VST3/Release') '125A Rifferator.vst3'
          if (-not (Test-Path $plugin)) { throw 'Rifferator VST3 bundle missing' }
          & $validator.FullName -e $plugin
          if ($LASTEXITCODE -ne 0) { throw "Steinberg validator failed: $LASTEXITCODE" }
      - name: Save built binaries
        uses: actions/upload-artifact@v4
        with:
          name: rifferator-dev-windows-x64
          path: build/VST3/Release/*.vst3
          if-no-files-found: warn
