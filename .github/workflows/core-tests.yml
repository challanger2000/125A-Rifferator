name: Clean Rifferator Core Tests
on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v1.0.0-clean
      - feature/v1-bar-copy-paste
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/core-tests.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure and compile isolated core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug && cmake --build build -j2
      - name: Run core regressions
        run: ctest --test-dir build --output-on-failure
