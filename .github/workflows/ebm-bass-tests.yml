name: EBM Bass Engine - isolated tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ebm-bass-engine
    paths:
      - 'src/core/EbmBass*.hpp'
      - 'tests/ebm_bass_*.cpp'
      - '.github/workflows/ebm-bass-tests.yml'

permissions:
  contents: read

jobs:
  ebm-core-tests:
    name: EBM C++23 core and arrangement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated test executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ebm-test-bin
          g++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror tests/ebm_bass_engine_tests.cpp -o ebm-test-bin/engine
          g++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror tests/ebm_bass_arrangement_tests.cpp -o ebm-test-bin/arrangement
          g++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror tests/ebm_bass_midi_audit_tests.cpp -o ebm-test-bin/midi-audit
      - name: Run EBM regressions
        shell: bash
        run: |
          set -euo pipefail
          ./ebm-test-bin/engine
          ./ebm-test-bin/arrangement
          ./ebm-test-bin/midi-audit
