name: Rifferator Experimental Windows VST3
on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v1.0.0-clean
    paths:
      - 'src/vst3/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-vst3.yml'
permissions:
  contents: read
jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure SDK 3.8.1 x64
        shell: pwsh
        run: cmake -S . -B build-vst3 -G "Visual Studio 17 2022" -A x64 -DRIFFERATOR_ENABLE_VST3=ON
      - name: Compile prototype VST3 and all C++ tests
        shell: pwsh
        run: cmake --build build-vst3 --config Release --parallel 4 --target Rifferator rifferator_core_tests rifferator_runtime_tests rifferator_midi_file_tests rifferator_state_tests rifferator_gui_geometry_tests
      - name: Run SDK-free regression suite on Windows
        shell: pwsh
        run: ctest --test-dir build-vst3 -C Release --output-on-failure
      - name: Build independent Steinberg VST3 Validator
        shell: pwsh
        run: cmake --build build-vst3 --config Release --parallel 4 --target validator
      - name: Stage experimental VST3 bundle
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path build-vst3 -Directory -Filter '*.vst3' -Recurse)
          if ($bundles.Count -lt 1) { throw "No VST3 bundle found" }
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Path $bundles[0].FullName -Destination stage -Recurse
          $bundle = Join-Path stage 'Rifferator.vst3'
          if (-not (Test-Path $bundle -PathType Container)) { throw "Missing complete bundle" }
          $branded = Join-Path stage '125A Rifferator.vst3'
          Move-Item -LiteralPath $bundle -Destination $branded
          $inner = Join-Path $branded 'Contents/x86_64-win/Rifferator.vst3'
          if (-not (Test-Path $inner -PathType Leaf)) { throw "Missing Windows x64 module" }
          Move-Item -LiteralPath $inner -Destination (Join-Path $branded 'Contents/x86_64-win/125A Rifferator.vst3')
      - name: Validate embedded GUI resources and root template
        shell: pwsh
        run: |
          $bundle = Join-Path (Resolve-Path stage).Path '125A Rifferator.vst3'
          $resources = Join-Path $bundle 'Contents/Resources'
          $ui = Join-Path $resources 'rifferator.uidesc'
          $logo = Join-Path $resources '125A_Logo_Master_FINAL.svg'
          if (-not (Test-Path $ui -PathType Leaf)) { throw "Missing VSTGUI UIDESC in bundle" }
          if (-not (Test-Path $logo -PathType Leaf)) { throw "Missing original 125A Master logo in bundle" }
          [xml]$xml = Get-Content -Raw -LiteralPath $ui
          if ($xml.DocumentElement.Name -ne 'vstgui-ui-description') { throw "UIDESC root invalid" }
          $template = $xml.DocumentElement.SelectSingleNode('./template[@name="RifferatorView"]')
          if ($null -eq $template) { throw "Missing root RifferatorView template" }
          if ($template.GetAttribute('size') -ne '1160,570') { throw "Wrong VSTGUI root size" }
          $panel = $template.SelectSingleNode('./view[@custom-view-name="RifferatorPanel"]')
          $master = $template.SelectSingleNode('./view[@custom-view-name="RifferatorBrandLogo"]')
          if ($null -eq $panel -or $null -eq $master) { throw "Missing custom VSTGUI panel or logo" }
          $expectedHash = (Get-FileHash -Algorithm SHA256 'resource/125A_Logo_Master_FINAL.svg').Hash
          $realHash = (Get-FileHash -Algorithm SHA256 $logo).Hash
          if ($expectedHash -ne $realHash) { throw "Master logo asset differs from repository source" }
      - name: Checkout pinned 125A Plugin Tester probes
        uses: actions/checkout@v4
        with:
          repository: challanger2000/125A-Plugin-Tester
          ref: 70aeb0d9fa82541699994e050ab35ab625e8a417
          path: qa-source
      - name: Compile 125A host lifecycle, state, reload and MIDI event probes
        shell: pwsh
        run: |
          $sdk = (Resolve-Path 'build-vst3/_deps/vst3sdk-src').Path
          cmake -S qa-source -B build-qa -G "Visual Studio 17 2022" -A x64 "-DFETCHCONTENT_SOURCE_DIR_VST3SDK=$sdk"
          if ($LASTEXITCODE -ne 0) { throw "QA SDK configure failed" }
          cmake --build build-qa --config Release --parallel 4 --target PluginTester125AEditorLifecycleProbe PluginTester125AStateProbe PluginTester125AReloadProbe PluginTester125AIOEventProbe
          if ($LASTEXITCODE -ne 0) { throw "125A host probes failed to compile" }
      - name: 125A host lifecycle and MIDI/event probes
        shell: pwsh
        timeout-minutes: 10
        run: |
          $bundle = (Resolve-Path 'stage/125A Rifferator.vst3').Path
          $qa = (Resolve-Path 'build-qa/Release').Path
          $checks = @(
            '125A_Plugin_Tester_StateProbe.exe',
            '125A_Plugin_Tester_ReloadProbe.exe',
            '125A_Plugin_Tester_IOEventProbe.exe'
          )
          foreach ($test in $checks) {
            $exe = Join-Path $qa $test
            if (-not (Test-Path $exe -PathType Leaf)) { throw "Missing 125A probe: $test" }
            & $exe $bundle
            if ($LASTEXITCODE -ne 0) { throw "125A probe failed: $test ($LASTEXITCODE)" }
          }
          $editor = Join-Path $qa '125A_Plugin_Tester_EditorLifecycleProbe.exe'
          if (-not (Test-Path $editor -PathType Leaf)) { throw "Missing 125A editor probe" }
          for ($pass = 1; $pass -le 4; $pass++) {
            Write-Host "125A editor lifecycle batch $pass/4 (5 editor cycles each)"
            & $editor $bundle
            if ($LASTEXITCODE -ne 0) { throw "125A editor lifecycle batch $pass failed ($LASTEXITCODE)" }
          }
      - name: Archive experimental VST3 (NOT FINAL)
        uses: actions/upload-artifact@v4
        with:
          name: Rifferator-V1-EXPERIMENTAL-Windows-x64
          path: stage/
          if-no-files-found: error
      - name: Steinberg VST3 Validator (host compliance only)
        shell: pwsh
        run: |
          $validator = Get-ChildItem build-vst3 -Recurse -File -Filter 'validator.exe' |
            Where-Object { $_.FullName -match 'Release' } |
            Select-Object -First 1
          if ($null -eq $validator) { throw "Steinberg validator executable missing" }
          $plugin = Join-Path (Resolve-Path stage).Path '125A Rifferator.vst3'
          & $validator.FullName -e $plugin
          if ($LASTEXITCODE -ne 0) { throw "Steinberg Validator failed: $LASTEXITCODE" }
